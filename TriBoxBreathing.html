<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Guided Breathing</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0f1a">

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Breathe">
    <link rel="apple-touch-icon" href="icon-180.png">

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0a0f1a;
            --bg-mid: #111827;
            --container-bg: rgba(255, 255, 255, 0.035);
            --container-border: rgba(255, 255, 255, 0.06);
            --fg-color: #e8e6e3;
            --fg-muted: #7a776f;
            --primary-color: #7eb8a8;
            --secondary-color: #c4a882;
            --accent-color: #a8c5b8;
            --inhale-color: #7eb8a8;
            --exhale-color: #b8937a;
            --hold-color: #8b9dc3;
            --inactive-color: #2a2f3a;
            --glow-sage: rgba(126, 184, 168, 0.35);
            --glow-terracotta: rgba(184, 147, 122, 0.35);
            --glow-blue: rgba(139, 157, 195, 0.35);
            --font-display: 'Cormorant Garamond', 'Georgia', serif;
            --font-ui: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --radius-sm: 12px;
            --radius-lg: 20px;
            --radius-pill: 999px;
            --transition-smooth: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            height: 100%;
            overscroll-behavior: none;
        }

        body {
            font-family: var(--font-ui);
            min-height: 100dvh;
            background: radial-gradient(ellipse at 50% 30%, var(--bg-mid) 0%, var(--bg-color) 70%);
            color: var(--fg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-y: auto;
            overscroll-behavior: none;
            touch-action: manipulation;
        }

        /* Noise texture overlay */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 256px 256px;
            pointer-events: none;
            z-index: 9999;
        }

        /* --- App Container --- */
        .app-container {
            width: 100%;
            max-width: 420px;
            min-height: 100dvh;
            background: var(--container-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 0;
            display: flex;
            flex-direction: column;
            /* Safe-area insets live inside the container so the installed app never exceeds the screen */
            padding:
                calc(1.5rem + env(safe-area-inset-top, 0px))
                calc(1.5rem + env(safe-area-inset-right, 0px))
                calc(1.5rem + env(safe-area-inset-bottom, 0px))
                calc(1.5rem + env(safe-area-inset-left, 0px));
            animation: fadeIn 0.8s ease-out;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* On larger screens, show as a card */
        @media (min-width: 480px) {
            .app-container {
                min-height: auto;
                height: 95vh;
                max-height: 780px;
                border: 1px solid var(--container-border);
                border-radius: var(--radius-lg);
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), 0 0 80px rgba(126, 184, 168, 0.05);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* --- Mode Switcher --- */
        .mode-switcher {
            display: flex;
            justify-content: center;
            margin-bottom: 1.25rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius-pill);
            padding: 4px;
            position: relative;
        }

        .mode-btn {
            flex: 1;
            padding: 0.65rem 1rem;
            font-family: var(--font-display);
            font-size: 0.95rem;
            font-weight: 300;
            font-style: italic;
            letter-spacing: 1px;
            background: transparent;
            color: var(--fg-muted);
            border: none;
            border-radius: var(--radius-pill);
            cursor: pointer;
            transition: color var(--transition-smooth), background var(--transition-smooth);
            min-height: 44px;
            position: relative;
            z-index: 1;
        }

        .mode-btn:focus-visible {
            outline: 2px solid var(--primary-color);
            outline-offset: 2px;
        }

        .mode-btn.active {
            background: rgba(126, 184, 168, 0.1);
            color: var(--primary-color);
            font-weight: 400;
        }

        /* --- Breathing Display --- */
        .breathing-display {
            flex: 1;
            display: grid;
            place-items: center;
            position: relative;
            min-height: min(280px, 38dvh);
        }

        .shape-container {
            position: relative;
            width: min(240px, 36dvh);
            height: min(240px, 36dvh);
        }

        /* Soft orb that fills and empties with the breath (scale driven per frame) */
        .breath-orb {
            position: absolute;
            inset: 2%;
            border-radius: 50%;
            color: var(--primary-color);
            background: radial-gradient(circle closest-side, currentColor 0%, transparent 100%);
            opacity: 0.2;
            transform: scale(0.75);
            transition: color 0.8s ease;
            will-change: transform;
            pointer-events: none;
        }

        .shape-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
            overflow: visible;
        }

        #triangle-svg {
            transform: rotate(-150deg);
        }

        .shape-track {
            stroke: var(--inactive-color);
            stroke-width: 4;
            fill: none;
            opacity: 0.5;
        }

        .shape-progress {
            stroke: var(--primary-color);
            stroke-width: 6;
            fill: none;
            stroke-linecap: round;
            transition: stroke 0.6s ease;
            filter: url(#glow);
        }

        .display-text {
            position: absolute;
            text-align: center;
            user-select: none;
            pointer-events: none;
        }

        #phase-label {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 400;
            font-style: italic;
            letter-spacing: 3px;
            color: var(--primary-color);
            text-transform: uppercase;
            transition: color 0.6s ease;
        }

        #countdown-timer {
            font-family: var(--font-display);
            font-size: 5.5rem;
            font-weight: 300;
            line-height: 1;
            margin-top: 0.5rem;
            color: var(--fg-color);
            transition: text-shadow 0.6s ease;
        }

        .hidden { display: none !important; }

        /* --- Controls --- */
        .controls-section {
            padding-top: 0.5rem;
        }

        .controls, .toggles {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .controls {
            margin-bottom: 1.25rem;
        }

        .toggles {
            margin-bottom: 0.75rem;
            gap: 0.5rem;
        }

        .btn, .toggle-btn {
            font-family: var(--font-ui);
            font-size: 0.875rem;
            font-weight: 500;
            letter-spacing: 0.4px;
            padding: 0.75rem 1.75rem;
            border-radius: var(--radius-pill);
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            min-height: 48px;
            min-width: 90px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all var(--transition-smooth);
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active, .toggle-btn:active {
            transform: scale(0.96);
        }

        .btn:focus-visible, .toggle-btn:focus-visible {
            outline: 2px solid var(--primary-color);
            outline-offset: 2px;
        }

        #action-btn {
            font-family: var(--font-display);
            font-size: 1.1rem;
            font-weight: 400;
            font-style: italic;
            letter-spacing: 2.5px;
            text-transform: lowercase;
            padding: 0.8rem 3rem;
            min-width: 140px;
        }

        .action-start {
            background: rgba(126, 184, 168, 0.12);
            color: var(--primary-color);
            border-color: rgba(126, 184, 168, 0.25);
        }

        .action-start:hover {
            background: rgba(126, 184, 168, 0.22);
            box-shadow: 0 0 30px rgba(126, 184, 168, 0.1);
        }

        .action-pause {
            background: rgba(196, 168, 130, 0.12);
            color: var(--secondary-color);
            border-color: rgba(196, 168, 130, 0.25);
        }

        .action-pause:hover {
            background: rgba(196, 168, 130, 0.22);
            box-shadow: 0 0 30px rgba(196, 168, 130, 0.1);
        }

        .toggle-btn {
            background: rgba(255, 255, 255, 0.03);
            color: var(--fg-muted);
            font-family: var(--font-display);
            font-size: 0.95rem;
            font-style: italic;
            font-weight: 300;
            letter-spacing: 1.2px;
            padding: 0.55rem 1.1rem;
            min-width: 0;
            border-color: rgba(255, 255, 255, 0.06);
            position: relative;
        }

        .toggle-btn::after {
            content: '';
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: transparent;
            transition: background 0.5s ease, box-shadow 0.5s ease;
        }

        .toggle-btn[aria-pressed="true"] {
            background: rgba(126, 184, 168, 0.08);
            color: var(--primary-color);
            border-color: rgba(126, 184, 168, 0.2);
        }

        .toggle-btn[aria-pressed="true"]::after {
            background: var(--primary-color);
            box-shadow: 0 0 6px var(--glow-sage);
        }

        .toggle-btn:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .toggle-btn[aria-pressed="true"]:hover {
            background: rgba(126, 184, 168, 0.14);
            box-shadow: 0 0 16px rgba(126, 184, 168, 0.08);
        }

        /* --- Footer --- */
        footer {
            text-align: center;
            color: var(--fg-muted);
            font-size: 0.8rem;
            padding-top: 0.75rem;
        }

        /* --- Duration Selector --- */
        .duration-selector {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .duration-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-size: 0.95rem;
            font-weight: 300;
            font-style: italic;
            letter-spacing: 0.5px;
            padding: 0.5rem 1rem;
            border-radius: var(--radius-pill);
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: var(--fg-muted);
            cursor: pointer;
            min-height: 44px;
            min-width: 52px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all var(--transition-smooth);
            -webkit-tap-highlight-color: transparent;
        }

        .duration-btn:active {
            transform: scale(0.96);
        }

        .duration-btn:focus-visible {
            outline: 2px solid var(--primary-color);
            outline-offset: 2px;
        }

        .duration-btn.selected {
            background: rgba(126, 184, 168, 0.1);
            color: var(--primary-color);
            border-color: rgba(126, 184, 168, 0.2);
        }

        .duration-btn:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .duration-value {
            font-weight: 400;
            line-height: 1.2;
        }

        /* --- Session Time --- */
        .session-time {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: var(--fg-muted);
            opacity: 0.7;
        }

        /* --- Session Complete Flash --- */
        .session-flash {
            text-align: center;
            animation: flashFadeIn 0.6s ease-out;
        }

        .session-flash .flash-text {
            font-family: var(--font-display);
            font-size: 1.1rem;
            font-weight: 400;
            font-style: italic;
            letter-spacing: 1.5px;
            max-width: 220px;
            margin: 0 auto;
            color: var(--primary-color);
            text-transform: uppercase;
        }

        /* --- Session Progress Bar --- */
        .session-progress {
            width: 200px;
            height: 2px;
            margin: 0.75rem auto 0;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 1px;
            overflow: hidden;
            display: none;
        }

        .session-progress::after {
            content: '';
            display: block;
            height: 100%;
            width: calc(var(--progress, 0) * 100%);
            background: var(--bar-color, var(--primary-color));
            border-radius: 1px;
            transition: width 0.3s linear, background-color 0.4s ease;
        }

        .session-progress.visible {
            display: block;
        }

        /* --- End Session Button --- */
        #end-btn {
            display: none;
            font-family: var(--font-display);
            font-style: italic;
            font-size: 0.95rem;
            letter-spacing: 1px;
            padding: 0.6rem 1.4rem;
            background: transparent;
            color: var(--fg-muted);
            border: 1px solid var(--container-border);
            border-radius: 2rem;
            cursor: pointer;
            transition: color 0.2s ease, border-color 0.2s ease;
        }

        #end-btn:hover {
            color: var(--fg-color);
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* --- In-session chrome: controls recede while breathing; tap anywhere to reveal toggles --- */
        .mode-switcher, .toggles {
            transition: opacity 0.6s ease, visibility 0s linear 0s;
        }

        .app-container.in-session .mode-switcher,
        .app-container.in-session:not(.reveal) .toggles {
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.2s ease, visibility 0s linear 1.2s;
        }

        .app-container.in-session:not(.reveal) #action-btn {
            opacity: 0.4;
        }

        @keyframes flashFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes flashFadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        /* --- Accessibility --- */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }

        @media (prefers-reduced-motion: reduce) {
            .shape-progress {
                transition: none;
            }
            .app-container {
                animation: none;
            }
        }
    </style>
</head>
<body>

    <main class="app-container">
        <header class="mode-switcher">
            <button id="box-mode-btn" class="mode-btn active" data-mode="box">4 x 4 Box</button>
            <button id="triangle-mode-btn" class="mode-btn" data-mode="triangle">4-7-8 Triangle</button>
        </header>

        <section class="breathing-display">
            <div id="shape-container" class="shape-container">
                <div id="breath-orb" class="breath-orb"></div>

                <!-- Shared SVG filter for glow effect -->
                <svg style="position:absolute;width:0;height:0">
                    <defs>
                        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
                            <feMerge>
                                <feMergeNode in="blur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                </svg>

                <svg id="box-svg" class="shape-svg" viewBox="0 0 100 100">
                    <path class="shape-track" d="M 5,5 L 95,5 L 95,95 L 5,95 Z" />
                    <path id="box-progress" class="shape-progress" d="M 5,5 L 95,5 L 95,95 L 5,95 Z" />
                </svg>
                <svg id="triangle-svg" class="shape-svg hidden" viewBox="0 0 100 100">
                    <path class="shape-track" d="M 50,5 L 95,82 L 5,82 Z" />
                    <path id="triangle-progress" class="shape-progress" d="M 50,5 L 95,82 L 5,82 Z" />
                </svg>
            </div>
            <div class="display-text">
                <div id="phase-label">Ready</div>
                <div id="countdown-timer"></div>
            </div>
        </section>

        <div id="session-progress" class="session-progress" style="--progress: 0;"></div>

        <div class="duration-selector" id="duration-selector">
            <button class="duration-btn" data-minutes="1">
                <span class="duration-value">1m</span>
            </button>
            <button class="duration-btn" data-minutes="2">
                <span class="duration-value">2m</span>
            </button>
            <button class="duration-btn" data-minutes="3">
                <span class="duration-value">3m</span>
            </button>
            <button class="duration-btn selected" data-minutes="5">
                <span class="duration-value">5m</span>
            </button>
        </div>

        <section class="controls-section">
            <div id="main-controls" class="controls">
                <button id="action-btn" class="btn action-start">Start</button>
                <button id="end-btn" aria-label="End session">End</button>
            </div>
            <div class="toggles">
                <button id="voice-toggle" class="toggle-btn" aria-pressed="true" title="Toggle Voice Cues">voice</button>
                <button id="breath-toggle" class="toggle-btn" aria-pressed="true" title="Toggle Breath Sound">breath</button>
                <button id="ambient-toggle" class="toggle-btn" aria-pressed="false" title="Toggle Ambient Sound">ambient</button>
            </div>
        </section>

        <footer>
            <div id="session-time" class="session-time">
                <span id="remaining-time"></span>
            </div>
        </footer>
    </main>

    <div id="announcer" class="sr-only" aria-live="assertive" aria-atomic="true"></div>

    <script type="module">
        // --- DATA LAYER ---
        const PHASES = {
            box: [
                { name: 'Inhale', duration: 4 },
                { name: 'Hold', duration: 4 },
                { name: 'Exhale', duration: 4 },
                { name: 'Hold', duration: 4 }
            ],
            triangle: [
                { name: 'Inhale', duration: 4 },
                { name: 'Hold', duration: 7 },
                { name: 'Exhale', duration: 8 }
            ]
        };

        // Empty the lungs before the first inhale (phaseIndex -1); not counted toward session time
        const LEAD_IN = { name: 'Exhale', label: 'Breathe out', duration: 3 };

        // A tick gap this long on return means the OS froze the page (iOS does this to
        // backgrounded web apps), so the session pauses where the audio stopped
        const STALL_MS = 1500;

        // Phase-to-color mapping for dynamic stroke + label color
        const PHASE_COLORS = {
            'Inhale': { color: 'var(--inhale-color)', glow: 'var(--glow-sage)' },
            'Exhale': { color: 'var(--exhale-color)', glow: 'var(--glow-terracotta)' },
            'Hold':   { color: 'var(--hold-color)',   glow: 'var(--glow-blue)' }
        };

        const PREF_KEY = 'breathingAppPrefs';
        // --- STATE ---
        let state = {
            mode: 'box',
            running: false,
            paused: false,
            phaseIndex: 0,
            phaseStartTime: 0,
            accumulatedPauseTime: 0,
            animationFrameId: null,
            lastTickTime: null,
            cycleCount: 0,
            sessionDuration: 5 * 60,
            sessionRemaining: 0,
            sessionComplete: false,
            flashActive: false,
            preferences: {
                voice: true,
                breath: true,
                ambient: null
            }
        };

        // --- UI ELEMENTS ---
        const UI = {
            app: document.querySelector('.app-container'),
            orb: document.getElementById('breath-orb'),
            phaseLabel: document.getElementById('phase-label'),
            countdownTimer: document.getElementById('countdown-timer'),
            actionBtn: document.getElementById('action-btn'),
            voiceToggle: document.getElementById('voice-toggle'),
            breathToggle: document.getElementById('breath-toggle'),
            ambientToggle: document.getElementById('ambient-toggle'),
            announcer: document.getElementById('announcer'),
            remainingTime: document.getElementById('remaining-time'),
            durationSelector: document.getElementById('duration-selector'),
            sessionTimeDisplay: document.getElementById('session-time'),
            boxSVG: document.getElementById('box-svg'),
            triangleSVG: document.getElementById('triangle-svg'),
            boxProgress: document.getElementById('box-progress'),
            triangleProgress: document.getElementById('triangle-progress'),
            modeBtns: document.querySelectorAll('.mode-btn'),
            sessionProgress: document.getElementById('session-progress'),
            endBtn: document.getElementById('end-btn')
        };

        // --- AUDIO ---
        let audioContext;
        let breathNodes = {};
        let ambientNodes = {};
        let cachedVoice = null;
        let isReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        window.matchMedia('(prefers-reduced-motion: reduce)')
            .addEventListener('change', e => { isReducedMotion = e.matches; });

        // --- SVG PATH LENGTHS ---
        const pathLengths = {
            box: UI.boxProgress.getTotalLength(),
            triangle: UI.triangleProgress.getTotalLength()
        };

        // =================================================================
        // CORE LOGIC
        // =================================================================

        function init() {
            // Event Listeners
            UI.actionBtn.addEventListener('click', () => {
                // Ignore taps during the completion flash; its auto-reset would kill a new session
                if (state.flashActive) return;
                if (state.running && !state.paused) pauseBreathing();
                else startBreathing();
            });

            UI.endBtn.addEventListener('click', () => {
                if (state.paused) {
                    // Resume AudioContext so ambient keeps playing after the session
                    if (audioContext) ensureAudioContext();
                    announce('Session ended.');
                    showSessionSummary();
                }
            });

            // While breathing, a tap anywhere briefly brings back the faded toggles
            UI.app.addEventListener('click', e => {
                if (!state.running || state.paused) return;
                // The Start/Resume tap itself bubbles here; it shouldn't reveal anything
                if (e.target.closest('#action-btn')) return;
                revealControls();
            });

            document.addEventListener('visibilitychange', handleVisibilityChange);

            UI.modeBtns.forEach(btn => {
                btn.addEventListener('click', () => setMode(btn.dataset.mode));
            });

            UI.voiceToggle.addEventListener('click', () => togglePreference('voice'));
            UI.breathToggle.addEventListener('click', () => togglePreference('breath'));

            // Duration selector
            document.querySelectorAll('.duration-btn').forEach(btn => {
                btn.addEventListener('click', () => selectDuration(parseInt(btn.dataset.minutes)));
            });

            // Ambient toggle — simple on/off for fireplace
            UI.ambientToggle.addEventListener('click', () => {
                ensureAudioContext();
                if (ambientActive) {
                    toggleAmbient('fireplace', false);
                    ambientActive = false;
                    // After the 1s fade-out, release audio if nothing else is playing
                    setTimeout(idleAudio, 1200);
                } else {
                    toggleAmbient('fireplace', true);
                    ambientActive = true;
                }
                updateToggleState(UI.ambientToggle, ambientActive);
                state.preferences.ambient = ambientActive ? 'fireplace' : null;
                savePreferences();
            });

            // Keyboard Shortcuts
            window.addEventListener('keydown', e => {
                if (e.code === 'Space') {
                    e.preventDefault();
                    if (state.flashActive) return;
                    if (state.running && !state.paused) pauseBreathing();
                    else startBreathing();
                }
            });

            if ('speechSynthesis' in window) initVoices();

            loadPreferences();
            updateUIForState();
            resetUI();

            // Register service worker for PWA
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            }
        }

        function currentPhase() {
            return state.phaseIndex < 0 ? LEAD_IN : PHASES[state.mode][state.phaseIndex];
        }

        // Session logic, driven by wall-clock time so a late tick (throttled or
        // backgrounded page) catches up on phase boundaries instead of drifting
        function tick(now) {
            if (!state.running || state.paused) return;

            if (state.phaseIndex >= 0) {
                const delta = (now - state.lastTickTime) / 1000;
                state.sessionRemaining = Math.max(0, state.sessionRemaining - delta);
                // Time is up: finish the current cycle, then wind down
                if (state.sessionRemaining <= 0) state.sessionComplete = true;
            }
            state.lastTickTime = now;

            let phase = currentPhase();
            let advanced = false;
            while (now - state.phaseStartTime >= phase.duration * 1000) {
                state.phaseStartTime += phase.duration * 1000;
                if (!advancePhase()) return;
                phase = currentPhase();
                advanced = true;
            }
            if (advanced) enterPhase((now - state.phaseStartTime) / 1000);
        }

        function frame() {
            const now = performance.now();
            tick(now);
            if (!state.running || state.paused) return;
            render(now);
            state.animationFrameId = requestAnimationFrame(frame);
        }

        // =================================================================
        // MOBILE LIFECYCLE
        // =================================================================

        // rAF stops in hidden pages; a timer keeps the session (and its audio cues)
        // going where the platform allows background execution
        let backgroundTimer = null;

        function handleVisibilityChange() {
            if (document.hidden) {
                if (state.running && !state.paused && !backgroundTimer) {
                    backgroundTimer = setInterval(() => tick(performance.now()), 250);
                }
                return;
            }

            clearInterval(backgroundTimer);
            backgroundTimer = null;
            if (!state.running || state.paused) return;

            if (performance.now() - state.lastTickTime > STALL_MS) {
                // The page was frozen while away: pause at the last moment it was running
                pauseBreathing(state.lastTickTime);
                return;
            }

            requestWakeLock();
            // iOS can hand back an 'interrupted' context (calls, Siri) whose resume() may
            // never settle; if audio isn't back shortly, pause rather than continue silently
            if (audioContext && audioContext.state !== 'running') {
                audioContext.resume().catch(() => {});
                setTimeout(() => {
                    if (audioContext.state !== 'running') pauseBreathing();
                }, 1000);
            }
            cancelAnimationFrame(state.animationFrameId);
            state.animationFrameId = requestAnimationFrame(frame);
        }

        // Keep the screen awake during a session; the OS drops the lock whenever
        // the page is hidden, so it is re-requested on return
        let wakeLockRequest = null;

        function requestWakeLock() {
            if (!('wakeLock' in navigator) || wakeLockRequest || document.hidden) return;
            const request = navigator.wakeLock.request('screen').then(sentinel => {
                sentinel.addEventListener('release', () => {
                    if (wakeLockRequest === request) wakeLockRequest = null;
                });
                return sentinel;
            }).catch(() => {
                if (wakeLockRequest === request) wakeLockRequest = null;
                return null;
            });
            wakeLockRequest = request;
        }

        function releaseWakeLock() {
            if (!wakeLockRequest) return;
            const pending = wakeLockRequest;
            wakeLockRequest = null;
            pending.then(sentinel => sentinel && sentinel.release()).catch(() => {});
        }

        let revealTimer = null;

        function revealControls() {
            UI.app.classList.add('reveal');
            clearTimeout(revealTimer);
            revealTimer = setTimeout(() => UI.app.classList.remove('reveal'), 4000);
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return m > 0 ? `${m}m ${s}s` : `${s}s`;
        }

        function ensureAudioContext() {
            if (!audioContext) {
                // iOS: play Web Audio as media so the ring/silent switch doesn't mute it.
                // Other apps' music pauses while this plays; idleAudio() releases it.
                if ('audioSession' in navigator) {
                    try { navigator.audioSession.type = 'playback'; } catch {}
                }
                try {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    console.error("Web Audio API is not supported.");
                    return false;
                }
                // Unlock iOS audio pipeline with silent buffer during user gesture
                const silentBuffer = audioContext.createBuffer(1, 1, audioContext.sampleRate);
                const src = audioContext.createBufferSource();
                src.buffer = silentBuffer;
                src.connect(audioContext.destination);
                src.start();
                // Warm up speechSynthesis during user gesture (iOS requires this)
                if ('speechSynthesis' in window) {
                    const warmup = new SpeechSynthesisUtterance(' ');
                    warmup.volume = 0;
                    speechSynthesis.speak(warmup);
                }
            }
            // 'interrupted' (iOS, after calls or Siri) needs a resume too, not just 'suspended'
            if (audioContext.state !== 'running' && audioContext.state !== 'closed') {
                audioContext.resume().catch(() => {});
            }
            return true;
        }

        // Suspend audio when nothing is audible so the OS releases the audio
        // session and other apps' music can resume
        function idleAudio() {
            if (audioContext && audioContext.state === 'running' && !state.running && !ambientActive) {
                audioContext.suspend();
            }
        }

        function startBreathing() {
            if (!ensureAudioContext()) {
                UI.breathToggle.disabled = true;
                return;
            }

            // Start ambient if enabled but not playing (also covers a saved preference after relaunch)
            if (ambientActive && !ambientNodes['fireplace']) {
                toggleAmbient('fireplace', true);
            }

            if (state.paused) {
                state.paused = false;
                state.phaseStartTime = performance.now() - state.accumulatedPauseTime;
                announce("Resumed.");
            } else {
                if (state.running) return;
                state.sessionRemaining = state.sessionDuration;
                state.sessionComplete = false;
                state.phaseIndex = -1;
                state.phaseStartTime = performance.now();
                enterPhase();
            }

            state.running = true;
            state.lastTickTime = performance.now();
            requestWakeLock();
            state.animationFrameId = requestAnimationFrame(frame);
            updateUIForState();
        }

        // `at` lets a frozen page pause at its last live moment rather than now
        function pauseBreathing(at = performance.now()) {
            if (!state.running || state.paused) return;
            state.paused = true;
            state.accumulatedPauseTime = at - state.phaseStartTime;
            cancelAnimationFrame(state.animationFrameId);
            releaseWakeLock();

            // Suspend AudioContext to freeze all audio in place
            if (audioContext && audioContext.state === 'running') {
                audioContext.suspend();
            }

            updateUIForState();
            announce("Paused.");
        }

        function resetToReady() {
            state.running = false;
            state.paused = false;
            state.sessionComplete = false;
            state.flashActive = false;
            state.sessionRemaining = 0;
            cancelAnimationFrame(state.animationFrameId);
            state.animationFrameId = null;

            state.cycleCount = 0;
            releaseWakeLock();

            if (audioContext) {
                stopBreathSound();
            }
            if ('speechSynthesis' in window) speechSynthesis.cancel();
            // Ambient keeps playing — do NOT reset it (a pause may have suspended it)
            if (ambientActive) ensureAudioContext();
            else idleAudio();

            // Remove any session flash element
            const flash = document.querySelector('.session-flash');
            if (flash) flash.remove();

            resetUI();
            updateUIForState();
            announce("Ready.");
        }

        function setMode(newMode) {
            if (newMode === state.mode) return;
            // Switching mode ends the session, so only allow it once paused
            if (state.running && !state.paused) return;
            if (state.running) resetToReady();

            state.mode = newMode;

            UI.boxSVG.classList.toggle('hidden', state.mode !== 'box');
            UI.triangleSVG.classList.toggle('hidden', state.mode === 'box');

            updateUIForState();
            resetUI();
        }

        // Returns false when the session wound down instead of continuing
        function advancePhase() {
            state.phaseIndex++;
            if (state.phaseIndex >= PHASES[state.mode].length) {
                state.phaseIndex = 0;
                incrementCycle();

                // Wind-down: if session timer expired, show summary instead of continuing
                if (state.sessionComplete) {
                    showSessionSummary();
                    return false;
                }
            }
            return true;
        }

        // `lateBy` (seconds) is how far into the phase we already are when a late tick enters it
        function enterPhase(lateBy = 0) {
            const newPhase = currentPhase();
            const label = newPhase.label || newPhase.name;

            UI.phaseLabel.textContent = label;
            announce(`${label} for ${newPhase.duration} seconds.`);

            // Update colors based on phase
            const { color, glow } = PHASE_COLORS[newPhase.name];
            const progressEl = state.mode === 'box' ? UI.boxProgress : UI.triangleProgress;
            progressEl.style.stroke = color;
            UI.phaseLabel.style.color = color;
            UI.orb.style.color = color;
            UI.countdownTimer.style.textShadow = `0 0 30px ${glow}`;
            UI.sessionProgress.style.setProperty('--bar-color', color);

            // Too far in to be useful (catching up after the page was throttled)
            if (lateBy > newPhase.duration / 2) return;

            if (state.preferences.voice) {
                speakCue(label);
            }

            if (state.preferences.breath && (newPhase.name === 'Inhale' || newPhase.name === 'Exhale')) {
                playBreathSound(newPhase.name, newPhase.duration - lateBy);
            }
        }

        function incrementCycle() {
            state.cycleCount++;
        }

        // =================================================================
        // UI & VISUALS
        // =================================================================

        function render(now) {
            const phase = currentPhase();
            const elapsed = (now - state.phaseStartTime) / 1000;
            const progress = Math.min(elapsed / phase.duration, 1.0);

            setText(UI.countdownTimer, Math.ceil(phase.duration - elapsed));

            // The trace starts with the first real phase, not the lead-in
            if (state.phaseIndex >= 0) updateShapeProgress(isReducedMotion ? 1 : progress);
            UI.orb.style.transform = `scale(${isReducedMotion ? 0.75 : 0.5 + 0.5 * breathLevel(phase, progress)})`;

            setText(UI.remainingTime, formatTime(state.sessionRemaining));
            const sessionProgress = state.sessionDuration > 0
                ? 1 - (state.sessionRemaining / state.sessionDuration) : 0;
            UI.sessionProgress.style.setProperty('--progress', Math.min(1, sessionProgress));
        }

        // How full the lungs are (0..1), eased like a natural breath
        function breathLevel(phase, progress) {
            const eased = (1 - Math.cos(Math.PI * progress)) / 2;
            if (phase === LEAD_IN) return 0.5 * (1 - eased);
            if (phase.name === 'Inhale') return eased;
            if (phase.name === 'Exhale') return 1 - eased;
            // Hold: stay where the previous phase left off
            const phases = PHASES[state.mode];
            const prev = phases[(state.phaseIndex - 1 + phases.length) % phases.length];
            return prev.name === 'Inhale' ? 1 : 0;
        }

        // Avoid re-laying out text every frame when the value hasn't changed
        function setText(el, value) {
            const text = String(value);
            if (el.textContent !== text) el.textContent = text;
        }

        function updateShapeProgress(progress) {
            const totalLength = pathLengths[state.mode];
            const phaseCount = PHASES[state.mode].length;
            const segmentLength = totalLength / phaseCount;

            const startOffset = totalLength - (state.phaseIndex * segmentLength);
            const currentOffset = startOffset - (progress * segmentLength);

            const progressEl = state.mode === 'box' ? UI.boxProgress : UI.triangleProgress;
            progressEl.style.strokeDashoffset = `${currentOffset}`;
        }

        function resetUI() {
            UI.phaseLabel.textContent = 'Ready';
            UI.phaseLabel.style.color = '';
            UI.countdownTimer.textContent = '';
            UI.countdownTimer.style.textShadow = '';
            UI.remainingTime.textContent = '';
            UI.durationSelector.classList.remove('hidden');
            UI.orb.style.transform = '';
            UI.orb.style.color = '';

            const progressEl = state.mode === 'box' ? UI.boxProgress : UI.triangleProgress;
            const totalLength = pathLengths[state.mode];
            progressEl.style.strokeDasharray = `${totalLength}`;
            progressEl.style.strokeDashoffset = `${totalLength}`;
            progressEl.style.stroke = '';

            // Reset progress bar and end button
            UI.sessionProgress.style.setProperty('--progress', 0);
            UI.sessionProgress.classList.remove('visible');
            UI.endBtn.style.display = 'none';
        }

        function updateActionButton() {
            if (!state.running || state.paused) {
                UI.actionBtn.textContent = state.paused ? 'Resume' : 'Start';
                UI.actionBtn.className = 'btn action-start';
                UI.actionBtn.setAttribute('aria-label', state.paused ? 'Resume breathing' : 'Start breathing');
            } else {
                UI.actionBtn.textContent = 'Pause';
                UI.actionBtn.className = 'btn action-pause';
                UI.actionBtn.setAttribute('aria-label', 'Pause breathing');
            }
            UI.endBtn.style.display = state.paused ? 'inline-block' : 'none';
        }

        function updateUIForState() {
            updateActionButton();

            // Fade the chrome while breathing; everything returns on pause
            const inSession = state.running && !state.paused;
            UI.app.classList.toggle('in-session', inSession);
            if (!inSession) {
                clearTimeout(revealTimer);
                UI.app.classList.remove('reveal');
            }

            // Duration selector: visible when not running, hidden during session
            UI.durationSelector.classList.toggle('hidden', state.running);

            // Session progress bar: visible during session
            UI.sessionProgress.classList.toggle('visible', state.running);

            UI.modeBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === state.mode);
            });

            // Update duration pill selection
            document.querySelectorAll('.duration-btn').forEach(btn => {
                btn.classList.toggle('selected', parseInt(btn.dataset.minutes) === state.sessionDuration / 60);
            });

            updateToggleState(UI.voiceToggle, state.preferences.voice);
            updateToggleState(UI.breathToggle, state.preferences.breath);

            // Restore ambient toggle state
            ambientActive = state.preferences.ambient === 'fireplace';
            updateToggleState(UI.ambientToggle, ambientActive);
        }

        function updateToggleState(button, isActive) {
            button.setAttribute('aria-pressed', isActive);
        }

        // =================================================================
        // AUDIO — Voice Cues
        // =================================================================

        // Voice cue preferences — soft, soothing iOS-optimized
        const PREFERRED_VOICES = ['Samantha', 'Karen', 'Moira', 'Tessa'];

        function initVoices() {
            const pickVoice = () => {
                if (cachedVoice) return;
                const voices = speechSynthesis.getVoices();
                if (!voices.length) return;
                // Prefer specific iOS voices known for natural sound
                for (const name of PREFERRED_VOICES) {
                    const match = voices.find(v => v.name.includes(name) && v.lang.startsWith('en'));
                    if (match) { cachedVoice = match; return; }
                }
                // Fall back to any English voice
                cachedVoice = voices.find(v => v.lang.startsWith('en')) || voices[0];
            };
            pickVoice();
            speechSynthesis.addEventListener('voiceschanged', pickVoice);
        }

        function speakCue(text) {
            if (!('speechSynthesis' in window) || !state.preferences.voice) return;
            speechSynthesis.cancel();
            const utt = new SpeechSynthesisUtterance(text);
            if (cachedVoice) utt.voice = cachedVoice;
            utt.rate = 0.75;
            utt.pitch = 0.9;
            utt.volume = 0.6;
            speechSynthesis.speak(utt);
        }

        // Inhale and exhale sound different so the audio alone carries the pattern:
        // inhale brightens and swells toward full lungs, then releases;
        // exhale starts full and darkens as it settles
        function playBreathSound(kind, duration) {
            if (!audioContext || !state.preferences.breath || duration < 0.5) return;

            stopBreathSound();

            const now = audioContext.currentTime;
            const end = now + duration;
            const inhale = kind === 'Inhale';

            const source = makeNoiseSource(duration);

            const filter = audioContext.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(inhale ? 350 : 1200, now);
            filter.frequency.exponentialRampToValueAtTime(inhale ? 1200 : 350, end);

            const gain = audioContext.createGain();
            gain.gain.setValueAtTime(0, now);
            if (inhale) {
                gain.gain.linearRampToValueAtTime(0.03, now + 0.3);
                gain.gain.linearRampToValueAtTime(0.1, end - 0.3);
            } else {
                gain.gain.linearRampToValueAtTime(0.1, now + 0.2);
                gain.gain.linearRampToValueAtTime(0.03, end - 0.3);
            }
            gain.gain.linearRampToValueAtTime(0, end);

            source.connect(filter).connect(gain).connect(audioContext.destination);
            source.start(now);
            source.stop(end);
            source.onended = () => { source.disconnect(); filter.disconnect(); gain.disconnect(); };

            breathNodes = { source, filter, gain };
        }

        // =================================================================
        // AUDIO — Ambient
        // =================================================================

        let ambientActive = false;

        function stopBreathSound() {
            try { if (breathNodes.source) breathNodes.source.stop(); } catch {}
            if (breathNodes.gain) breathNodes.gain.gain.cancelScheduledValues(audioContext.currentTime);
        }

        // Reusable noise buffer (generate once, share across ambient sounds)
        let sharedNoiseBuffer = null;
        function getNoiseBuffer(seconds = 4) {
            if (sharedNoiseBuffer && sharedNoiseBuffer.duration >= seconds) return sharedNoiseBuffer;
            const bufferSize = audioContext.sampleRate * seconds;
            const buffer = audioContext.createBuffer(2, bufferSize, audioContext.sampleRate);
            for (let ch = 0; ch < 2; ch++) {
                const data = buffer.getChannelData(ch);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            }
            sharedNoiseBuffer = buffer;
            return buffer;
        }

        function makeNoiseSource(seconds) {
            const s = audioContext.createBufferSource();
            s.buffer = getNoiseBuffer(seconds);
            s.loop = true;
            return s;
        }

        function toggleAmbient(type, enabled) {
            if (enabled && !ensureAudioContext()) return;
            if (!audioContext) return;

            if (enabled) {
                if (ambientNodes[type]) return;

                const sources = [];
                const oscillators = [];
                let timeoutId = null;
                const spawnedSources = [];

                // Master gain for this ambient type
                const master = audioContext.createGain();
                master.gain.setValueAtTime(0, audioContext.currentTime);
                master.gain.linearRampToValueAtTime(0.07, audioContext.currentTime + 2.0);

                // Fireplace ambient — the only ambient sound
                // Layer 1: Brownian noise rumble (deep warm base)
                const rumble = makeNoiseSource(4);
                const rumbleFilter = audioContext.createBiquadFilter();
                rumbleFilter.type = 'lowpass';
                rumbleFilter.frequency.value = 150;
                rumbleFilter.Q.value = 0.7;
                const rumbleGain = audioContext.createGain();
                rumbleGain.gain.value = 0.8;
                rumble.connect(rumbleFilter).connect(rumbleGain).connect(master);
                rumble.start();
                sources.push(rumble);

                // Layer 2: tight mid body (narrower bandpass for warmth)
                const midNoise = makeNoiseSource(4);
                const midFilter = audioContext.createBiquadFilter();
                midFilter.type = 'bandpass';
                midFilter.frequency.value = 500;
                midFilter.Q.value = 2.0;
                const midGain = audioContext.createGain();
                midGain.gain.value = 0.2;
                midNoise.connect(midFilter).connect(midGain).connect(master);
                midNoise.start();
                sources.push(midNoise);

                // Layer 3: random crackle/pop events
                const crackle = () => {
                    const entry = ambientNodes[type];
                    if (!entry) return;
                    const burstLen = 0.02 + Math.random() * 0.02;
                    const burstBuf = audioContext.createBuffer(1, audioContext.sampleRate * burstLen, audioContext.sampleRate);
                    const bd = burstBuf.getChannelData(0);
                    for (let i = 0; i < bd.length; i++) bd[i] = Math.random() * 2 - 1;
                    const burst = audioContext.createBufferSource();
                    burst.buffer = burstBuf;
                    const burstFilter = audioContext.createBiquadFilter();
                    burstFilter.type = 'highpass';
                    burstFilter.frequency.value = 1000 + Math.random() * 2000;
                    const burstGain = audioContext.createGain();
                    const vol = 0.10 + Math.random() * 0.18;
                    burstGain.gain.setValueAtTime(vol, audioContext.currentTime);
                    burstGain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + burstLen);
                    burst.connect(burstFilter).connect(burstGain).connect(master);
                    burst.start();
                    burst.onended = () => { burst.disconnect(); burstFilter.disconnect(); burstGain.disconnect(); };

                    if (Math.random() < 0.5) {
                        const popLen = 0.01 + Math.random() * 0.015;
                        const popBuf = audioContext.createBuffer(1, audioContext.sampleRate * popLen, audioContext.sampleRate);
                        const pd = popBuf.getChannelData(0);
                        for (let i = 0; i < pd.length; i++) pd[i] = Math.random() * 2 - 1;
                        const pop = audioContext.createBufferSource();
                        pop.buffer = popBuf;
                        const popFilter = audioContext.createBiquadFilter();
                        popFilter.type = 'bandpass';
                        popFilter.frequency.value = 3000 + Math.random() * 2000;
                        popFilter.Q.value = 1.5;
                        const popGain = audioContext.createGain();
                        popGain.gain.setValueAtTime(0.06 + Math.random() * 0.08, audioContext.currentTime);
                        popGain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + popLen);
                        pop.connect(popFilter).connect(popGain).connect(master);
                        pop.start();
                        pop.onended = () => { pop.disconnect(); popFilter.disconnect(); popGain.disconnect(); };
                    }

                    const nextDelay = Math.random() < 0.4
                        ? 80 + Math.random() * 200
                        : 1200 + Math.random() * 3000;
                    entry.timeoutId = setTimeout(crackle, nextDelay);
                };
                timeoutId = setTimeout(crackle, 600 + Math.random() * 1000);

                master.connect(audioContext.destination);

                ambientNodes[type] = { sources, oscillators, gain: master, spawnedSources, timeoutId };

            } else {
                const nodes = ambientNodes[type];
                if (!nodes) return;

                // Clear any pending timeout
                if (nodes.timeoutId) clearTimeout(nodes.timeoutId);

                nodes.gain.gain.cancelScheduledValues(audioContext.currentTime);
                nodes.gain.gain.linearRampToValueAtTime(0, audioContext.currentTime + 1.0);

                // Stop all spawned sources
                for (const s of nodes.spawnedSources) {
                    try { s.stop(); } catch {}
                }

                setTimeout(() => {
                    for (const s of (nodes.sources || [])) {
                        try { s.stop(); } catch {}
                    }
                    for (const o of (nodes.oscillators || [])) {
                        try { o.stop(); } catch {}
                    }
                    nodes.gain.disconnect();
                }, 1100);

                delete ambientNodes[type];
            }
        }

        // =================================================================
        // DURATION & SESSION
        // =================================================================

        function selectDuration(minutes) {
            state.sessionDuration = minutes * 60;
            document.querySelectorAll('.duration-btn').forEach(btn => {
                btn.classList.toggle('selected', parseInt(btn.dataset.minutes) === minutes);
            });
            savePreferences();
        }

        function showSessionSummary() {
            // Stop the animation loop but keep ambient playing
            state.running = false;
            state.paused = false;
            state.flashActive = true;
            cancelAnimationFrame(state.animationFrameId);
            state.animationFrameId = null;
            clearInterval(backgroundTimer);
            backgroundTimer = null;
            releaseWakeLock();
            UI.endBtn.style.display = 'none';

            // Stop breath sounds — ambient keeps playing
            if (audioContext) {
                stopBreathSound();
            }
            if ('speechSynthesis' in window) speechSynthesis.cancel();

            // Calculate stats
            const cycles = state.cycleCount;

            // Update the display area
            UI.phaseLabel.textContent = '';
            UI.countdownTimer.textContent = '';
            UI.countdownTimer.style.textShadow = '';
            UI.remainingTime.textContent = '';

            // Create flash element
            const flash = document.createElement('div');
            flash.className = 'session-flash';
            const flashText = document.createElement('div');
            flashText.className = 'flash-text';
            flashText.textContent = `Session Complete \u00B7 ${cycles} cycle${cycles !== 1 ? 's' : ''}`;
            flash.appendChild(flashText);

            const displayText = document.querySelector('.display-text');
            displayText.appendChild(flash);

            if (state.preferences.voice) {
                speakCue('Session complete');
            }
            announce('Session Complete');

            // Auto-reset after 3 seconds
            setTimeout(() => {
                flash.style.animation = 'flashFadeOut 0.5s ease-out forwards';
                setTimeout(() => {
                    resetToReady();
                }, 500);
            }, 3000);
        }

        // =================================================================
        // UTILITIES & PERSISTENCE
        // =================================================================

        function announce(message) {
            UI.announcer.textContent = message;
        }

        function togglePreference(key) {
            state.preferences[key] = !state.preferences[key];
            const toggleEl = UI[`${key}Toggle`];
            if (toggleEl) updateToggleState(toggleEl, state.preferences[key]);
            savePreferences();
            // No audio unlock here: Start does it, and a live AudioContext while idle
            // would hold the 'playback' session and pause the user's music
        }

        function savePreferences() {
            try {
                const data = {
                    ...state.preferences,
                    sessionDuration: state.sessionDuration
                };
                localStorage.setItem(PREF_KEY, JSON.stringify(data));
            } catch {}
        }

        function loadPreferences() {
            try {
                const savedPrefs = localStorage.getItem(PREF_KEY);
                if (savedPrefs) {
                    const parsed = JSON.parse(savedPrefs);
                    if (parsed.sessionDuration) {
                        state.sessionDuration = parsed.sessionDuration;
                    }
                    // Migrate old ambient format (object → string|null)
                    if (parsed.ambient && typeof parsed.ambient === 'object') {
                        parsed.ambient = null;
                    }
                    // Migrate removed ambient types to null
                    if (parsed.ambient === 'waterfall' || parsed.ambient === 'nature') {
                        parsed.ambient = null;
                    }
                    // Strip removed preference keys
                    delete parsed.haptic;
                    delete parsed.sessionDuration;

                    state.preferences = {
                        ...state.preferences,
                        ...parsed
                    };

                    // Save cleaned preferences
                    savePreferences();
                }
            } catch {}
        }

        // --- Initialize ---
        init();
    </script>
</body>
</html>
